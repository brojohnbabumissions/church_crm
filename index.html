<!doctype html>
<html lang="te"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Prince of Life Ministries</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2a1a55"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#120a26;--card:#1f1440;--tx:#f3ecff;--mu:#a99cc7;--ac:#e0b45a;--ac2:#2c1d58;--bd:#8a6d2f;--gold:#e0b45a}
a{color:var(--gold)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#2a1a55,#120a26 65%) fixed;min-height:100vh;color:var(--tx);font:15px/1.55 "Noto Sans Telugu","Nirmala UI",system-ui,sans-serif}
header{background:linear-gradient(180deg,#2a1a55,#170d33);border-bottom:1px solid var(--gold);color:#fff;padding:14px;text-align:center}
#logo{position:relative;isolation:isolate;width:96px;height:96px;margin:0 auto 10px;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent}#logo::before{content:"";position:absolute;inset:-16px;z-index:-1;border-radius:50%;background:radial-gradient(circle closest-side,rgba(244,213,141,.75) 55%,rgba(244,213,141,0) 100%);animation:halo 3.5s ease-in-out infinite;pointer-events:none}
#logo img,#logo svg{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
header h1{margin:0;font:700 18px/1.35 "Cinzel",Georgia,serif;letter-spacing:1.8px;color:#f6e3a1;text-shadow:0 0 12px rgba(224,180,90,.6),0 1px 2px #0008}
header h1::after{content:"";display:block;width:150px;height:2px;margin:9px auto 0;background:linear-gradient(90deg,transparent,#e0b45a,transparent)}
@supports ((-webkit-background-clip:text) or (background-clip:text)){header h1{background:linear-gradient(100deg,#c99a3b 0%,#fff6cf 25%,#e0b45a 50%,#fff6cf 75%,#c99a3b 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;text-shadow:none;filter:drop-shadow(0 0 7px rgba(224,180,90,.55));animation:shine 5s linear infinite}}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes halo{0%,100%{opacity:.4;transform:scale(.92)}50%{opacity:.95;transform:scale(1.08)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
nav{display:flex;gap:8px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{flex:1;font-size:12.5px;padding:6px 4px;border-radius:9px}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;animation:up .45s ease both}
h2{margin:0 0 10px;font-size:16.5px;font-weight:700;color:var(--gold)}h3{margin:12px 0 6px;font-size:14px;color:var(--mu)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:84px}
button,.btn{font:inherit;line-height:1.25;border:0;border-radius:10px;padding:6px 14px;background:var(--ac2);color:var(--ac);font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.p{background:linear-gradient(135deg,#a67c2e,#e3c36b);color:#2a1647}button:active,.btn:active{transform:scale(.97)}
.btn{padding:6px 12px;font-size:13px;border-radius:9px}.wa{background:#25d366;color:#fff}.call{background:#2b7de9;color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--ac2);border-radius:12px;padding:10px;text-align:center;animation:pop .5s ease both}.stat b{display:block;font-size:22px;color:var(--ac)}.stat span{font-size:12px;color:var(--mu)}
.item{padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.item:last-child{border:0}
.mu{color:var(--mu);font-size:13px}.badge{background:var(--ac);color:#2a1647;border-radius:99px;padding:1px 8px;font-size:11px;margin-left:6px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:12px}
.verse{background:var(--ac2);border-left:4px solid var(--gold);padding:14px;border-radius:10px;font-size:15.5px;animation:pop .8s ease both}
.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--card);border-top:1px solid var(--gold);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;animation:up .3s ease both}
.center{text-align:center}.dgrid{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.dph{width:110px;height:110px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:var(--ac2);display:block}
.dtx{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:6px;min-width:0}
.dtx{--f:13px}.dtx b{color:var(--gold);font-size:var(--f);line-height:1.3;letter-spacing:.2px}.dtx span{font-size:calc(var(--f)*1.04);line-height:1.3}.dtx small{color:var(--mu);font-size:var(--f);line-height:1.3}
.ph{display:inline-block;border:1px solid var(--gold);border-radius:99px;padding:4px 11px;color:var(--gold);text-decoration:none;font-weight:600;font-size:calc(var(--f,13px)*1.05);letter-spacing:.4px;background:var(--ac2);white-space:nowrap}
.chip{padding:4px 10px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--mu);font-size:12.5px;font-weight:500}.chip.on{background:var(--ac);color:#2a1647;border-color:var(--ac)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:12px}.tabs button{padding:5px 1px;font-size:10.5px;line-height:1.25;background:var(--card);border:1px solid var(--bd)}.tabs button.on{background:linear-gradient(135deg,#a67c2e,#e3c36b);color:#2a1647;border-color:transparent}.tabs small{display:block;font-weight:400;opacity:.85;font-size:10px}
.err{color:#ff8a80;font-size:14px;min-height:20px}
.photo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);display:block;margin:0 auto 8px;background:var(--ac2);font-size:50px;line-height:104px}
.gc{padding:3px;border-radius:18px;background:linear-gradient(135deg,#a67c2e,#fff1b8,#c99a3b,#fff1b8,#a67c2e);background-size:250% 250%;animation:shine2 6s linear infinite,pop .8s ease both;margin-bottom:12px}
.gc-in{background:radial-gradient(ellipse at top,#3b2570,#1a0f38 70%);border-radius:15px;padding:20px 16px;text-align:center}
.gc-logo{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.gc-em{font-size:36px;margin:6px 0}
.gc-t{font-size:19px;font-weight:700;line-height:1.4;color:#f6e3a1}
.gc-n{font-size:24px;font-weight:700;margin:6px 0 10px;color:#fff;text-shadow:0 0 14px rgba(224,180,90,.7)}
.gc-m{margin:0 0 12px}
.gc-v{background:rgba(255,255,255,.07);border-left:3px solid var(--gold);border-right:3px solid var(--gold);border-radius:10px;padding:10px;font-size:14px;color:#f6e3a1;margin-bottom:12px}
.gc-v small{color:var(--mu)}
.gc2{margin-bottom:12px;text-align:center} .gcv{width:100%;max-width:520px;height:auto;aspect-ratio:1/1;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.45);display:block;margin:0 auto} .gcb{display:flex;gap:8px;margin:8px auto 0;max-width:520px} .gcb button{flex:1} .gc-s{font-size:13px;color:var(--gold)}
@keyframes shine2{from{background-position:0 0}to{background-position:250% 250%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

vision:"యేసుక్రీస్తు ప్రేమను మరియు ఆయన ఇచ్చే జీవాన్ని ప్రతి ఒక్కరికీ పంచడమే మా పరిచర్య యొక్క ప్రధాన లక్ష్యం. “జీవాధిపతి” (The Prince of Life) అయిన క్రీస్తు ద్వారా ప్రతి వ్యక్తికీ ఆత్మీయ రక్షణ, స్వస్థత మరియు నిరీక్షణ కలగాలని మేము ప్రార్థిస్తున్నాము.",
why:"ఈ పరిచర్యపై దేవుని ప్రత్యేకమైన దృష్టి మరియు ఆయన మనస్సు ఉంది. కనుక, మీరు పంపే ప్రతి న్యాయమైన ప్రార్థన విన్నపం దేవుని చిత్తానుసారంగా నెరవేరుతుందని మేము నమ్ముతున్నాము. మీ భారాలను ప్రార్థన ద్వారా దేవుని పాదాల చెంత పెట్టడానికి ఇదొక పవిత్ర వేదిక.",
verse:["ప్రభువు సమీపముగా ఉన్నాడు. దేనినిగూర్చియు చింతపడకుడి గాని ప్రతి విషయములోను ప్రార్థన విజ్ఞాపనములచేత కృతజ్ఞతాపూర్వకముగా మీ విన్నపములు దేవునికి తెలియజేయుడి.","ఫిలిప్పీ 4:5,6"],
times:["ఆదివారం ఆరాధన: ఉ|| 10 గం. నుండి 12:30 వరకు","ఆదివారం సండేస్కూల్: ఉ|| 8:30 నుండి 9:30 వరకు","బుధవారం ఆసక్తి ప్రార్థన: రా|| 7:30 నుండి 8:30 వరకు","శుక్రవారం ఆరాధన: రా|| 7:00 నుండి 9:30 వరకు","దేవునితో సంపూర్ణ సహవాస ప్రార్థన: ప్రతి రెండొవ శనివారం 10:00 గంటల నుండి సాయంత్రం 5:00 గంటల వరకు జరుగును","ఆల్ నైట్ ఆరాధన: దయచేసి సంప్రదించండి","ప్రతి నెల మొదటి ఆదివారం ప్రభువు బల్ల ఆరాధన ఇవ్వబడును."],

<h3>📝 Pastor Note / నా నోట్ (మీకు మాత్రమే కనిపిస్తుంది)</h3><textarea id="nt" placeholder="ఉదా: తల్లి అనారోగ్యం, ఆసుపత్రిలో. వచ్చే వారం సందర్శించాలి">${esc(p.Note||"")}</textarea><div style="margin-top:6px"><button id="sn">💾 నోట్ సేవ్</button> <span class="mu" id="nm"></span></div>
<h3>🙏 Prayers & Testimonies / ప్రార్థనలు, సాక్ష్యాలు</h3>${mine.map(x=>`<div class="item" style="cursor:default"><span class="pill">${esc(x.Kind)}</span><div>${esc(x.Text)}</div><div class="mu">${fmt(x.Time)}</div><select data-sid="${x.ID}" style="margin-top:6px;padding:6px"><option value="">— స్థితి / Status —</option>${Object.keys(ST).map(k=>`<option value="${k}"${x.Status===k?" selected":""}>${ST[k]}</option>`).join("")}</select></div>`).join("")||'<div class="mu">ఏమీ లేవు</div>'}
<button id="ap" style="width:100%;margin-top:10px">🙏 ప్రార్థన / సాక్ష్యం నమోదు చేయండి (Add)</button><div class="row" style="margin-top:8px"><button id="ed">✏️ Edit / మార్చండి</button><button id="rp">🔑 Reset PIN</button></div><button class="p" style="width:100%;margin-top:10px" id="cl2">Close / మూసివేయండి</button></div></div>`;
const close=()=>{$("#modal").innerHTML="";rPastor()};
$("#mm").onchange=async e=>{const sel=e.target.closest("[data-sid]");if(!sel)return;try{await run("pastorSetStatus",S.pin,sel.dataset.sid,sel.value);const x=S.D.prayers.find(y=>y.ID===sel.dataset.sid);if(x)x.Status=sel.value;sel.style.outline="2px solid var(--gold)"}catch(er){alert(er.message)}};
$("#sn").onclick=async()=>{try{await run("pastorUpdate",S.pin,p.ID,{note:$("#nt").value});p.Note=$("#nt").value;$("#nm").textContent="✔ సేవ్ అయింది"}catch(er){$("#nm").textContent=er.message}};
$("#ap").onclick=()=>prayerForm(p);$("#ed").onclick=()=>memberForm(p);
$("#rp").onclick=async()=>{try{const pn=await run("pastorResetPin",S.pin,p.Phone);pinResult(p.Name,p.Phone,pn,"🔑 కొత్త PIN / New PIN")}catch(er){alert(er.message)}};
$("#cl2").onclick=close;$("#mm").addEventListener("click",e=>{if(e.target.id==="mm")close()})}
render();
try{run("getVerses").then(a=>{if(a&&a.length){VERSES=a;if(S.v==="home"&&S.step==="choose")render()}}).catch(()=>{})}catch(e){}
</script></body></html>
